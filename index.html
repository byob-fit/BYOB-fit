<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161816" />
    <script>
      // First paint uses the chosen Appearance (D-039); IndexedDB confirms it later.
      try {
        var a = localStorage.getItem('byob-appearance')
        if (a === 'light' || a === 'dark') document.documentElement.dataset.theme = a
        var dark = a === 'dark' || (a !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#161816' : '#f5f2ec')
      } catch (e) {}
    </script>
    <link rel="icon" href="/BYOB-fit/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/BYOB-fit/apple-touch-icon.png" />
    <title>BYOB-fit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
